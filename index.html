<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tifo</title>
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #111318; --card: #1b1e25; --line: #2a2e38; --text: #eef0f4; --muted: #8b92a3;
    --live: #ff3b4e; --win: #2fbf71; --draw: #c9a23a; --loss: #e0525f;
    --accent: #e8b23a; --accent2: #8e1f2f;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         padding-bottom: calc(76px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color: transparent; }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
           backdrop-filter: blur(10px); padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
           border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 20px; letter-spacing: .5px; flex: 1; }
  header .bar { width: 6px; height: 22px; border-radius: 3px; background: linear-gradient(var(--accent), var(--accent2)); }
  #upd { font-size: 12px; color: var(--muted); }
  #refresh { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 4px 9px; font-size: 16px; }
  main { padding: 14px 16px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 20px 0 8px; }
  h2:first-child { margin-top: 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  a.card { display: block; color: inherit; text-decoration: none; }
  .match { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .side { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .side.away { justify-content: flex-end; text-align: right; }
  .side img { width: 28px; height: 28px; object-fit: contain; flex: none; }
  .side span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .score { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 64px; text-align: center; }
  .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .live-badge { color: var(--live); font-weight: 700; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .card.live { border-color: var(--live); box-shadow: 0 0 0 1px var(--live) inset; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .res { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #111; flex: none; }
  .res.V { background: var(--win); } .res.N { background: var(--draw); } .res.P { background: var(--loss); } .res.x { background: var(--line); color: var(--muted); }
  .row .opp { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .when { color: var(--muted); font-size: 12px; text-align: right; flex: none; }
  .news .src { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .news .t { font-weight: 600; }
  .team-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 6px; }
  .team-head img, .team-head .dot { width: 44px; height: 44px; object-fit: contain; }
  .team-head .dot { border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; font-weight: 900; color: #fff; }
  .team-head h3 { font-size: 22px; }
  .team-head p { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
  .btn { display: inline-block; margin: 4px 6px 4px 0; padding: 8px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); color: var(--text); text-decoration: none; font-size: 14px; }
  details > summary { cursor: pointer; list-style: none; padding: 2px 0 6px; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: " ▾"; color: var(--muted); }
  details[open] > summary::after { content: " ▴"; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(5, 1fr);
        background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { background: none; border: 0; color: var(--muted); padding: 8px 2px 10px; font-size: 11px; display: grid; justify-items: center; gap: 3px; }
  nav button .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #fff; }
  nav button.on { color: var(--text); }
  nav button.on .ic { outline: 2px solid var(--text); outline-offset: 2px; }
  .seg { display: flex; gap: 6px; margin: 2px 0 4px; overflow-x: auto; }
  .seg button { flex: none; background: var(--card); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .seg button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
</style>
</head>
<body>
<header>
  <div class="bar"></div>
  <h1>Tifo</h1>
  <span id="upd"></span>
  <button id="refresh" aria-label="Aggiorna">↻</button>
</header>
<main id="view"></main>
<nav id="nav"></nav>
<script src="app.js"></script>
</body>
</html>
