<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tifo</title>
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #111318; --card: #1b1e25; --line: #2a2e38; --text: #eef0f4; --muted: #8b92a3;
    --live: #ff3b4e; --win: #2fbf71; --draw: #c9a23a; --loss: #e0525f;
    --accent: #e8b23a; --accent2: #8e1f2f;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         padding-bottom: calc(24px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color: transparent; min-height: 100vh; }
  /* Sfondo della Home: foto mixate, scurite, sfocate e con colori tenui (discreto) */
  body:not(.team-bg) { background: var(--bg); }
  body:not(.team-bg)::before { content: ""; position: fixed; inset: -20px; z-index: -1; pointer-events: none;
    background: url("sfondo-telefono.jpg") center / cover no-repeat;
    filter: blur(3px) saturate(.55) brightness(.42); }
  @media (min-aspect-ratio: 1/1) { body:not(.team-bg)::before { background-image: url("sfondo-pc.jpg"); } }
  body:not(.team-bg) .tile { background: rgba(17,19,24,.55); backdrop-filter: blur(4px); border-color: rgba(255,255,255,.15); }
  body:not(.team-bg) header { background: rgba(10,12,16,.55); }
  /* Sfondo con i colori sociali della squadra, scurito per leggere bene i testi */
  body.team-bg { background: linear-gradient(rgba(10,12,16,.45), rgba(10,12,16,.65)),
                 linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%) fixed; }
  body.team-bg .card { background: rgba(20,22,28,.82); backdrop-filter: blur(6px); border-color: rgba(255,255,255,.12); }
  body.team-bg h2, body.team-bg .hint, body.team-bg .team-head p { color: #fff; text-shadow: 0 1px 3px #000a; }
  body.team-bg header { background: rgba(10,12,16,.55); }
  .hint { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  #upcoming { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  #upcoming::-webkit-scrollbar { display: none; }
  .up { flex: none; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line);
        border-radius: 12px; padding: 6px 10px; color: var(--text); font: 12px/1.25 inherit; text-align: left; cursor: pointer; }
  .up b { font-weight: 700; }
  .up.is-live { border-color: var(--live); }
  #upd { display: none; }
  #bell { order: 4; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 16px; cursor: pointer; }
  #bell.on { border-color: var(--accent); }
  #toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 20; margin: 0 auto; max-width: 480px;
           background: #22252d; color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; box-shadow: 0 6px 20px #0008; }
  header .spacer { flex: 1; }
  #home { background: rgba(255,255,255,.08); border: 1px solid var(--line); color: var(--text); border-radius: 10px;
          padding: 6px 12px; font: 600 14px/1 inherit; cursor: pointer; }
  /* Layout: contenuto + colonna laterale "Prossime partite" */
  .layout { display: flex; flex-direction: column; }
  #side { padding: 10px 16px 0; }
  .side-title { margin: 0 0 8px !important; }
  @media (max-width: 899px) {
    #side { order: -1; }                       /* telefono: fila compatta in alto */
    .side-title { display: none; }
  }
  @media (min-width: 900px) {
    .layout { flex-direction: row; align-items: flex-start; gap: 20px; max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    .layout main { flex: 1; min-width: 0; max-width: 760px; margin: 0 auto; }
    #side { width: 300px; flex: none; position: sticky; top: 70px; padding: 14px 0 0; }
    #upcoming { flex-direction: column; overflow: visible; }
    #upcoming .up { width: 100%; padding: 10px 12px; font-size: 13px; }
    #upcoming .up .crest.ic { width: 34px; height: 34px; }
  }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
           backdrop-filter: blur(10px); padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
           border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 20px; letter-spacing: .5px; margin-right: auto; }
  header .bar { width: 6px; height: 22px; border-radius: 3px; background: linear-gradient(var(--accent), var(--accent2)); }
  #upd { font-size: 12px; color: var(--muted); }
  #refresh { order: 4; background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 4px 9px; font-size: 16px; }
  main { padding: 14px 16px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 20px 0 8px; }
  h2:first-child { margin-top: 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  a.card { display: block; color: inherit; text-decoration: none; }
  .match { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .side { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .side.away { justify-content: flex-end; text-align: right; }
  .side img { width: 28px; height: 28px; object-fit: contain; flex: none; }
  .side span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .score { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 64px; text-align: center; }
  .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .live-badge { color: var(--live); font-weight: 700; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .card.live { border-color: var(--live); box-shadow: 0 0 0 1px var(--live) inset; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .res { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #111; flex: none; }
  .res.V { background: var(--win); } .res.N { background: var(--draw); } .res.P { background: var(--loss); } .res.x { background: var(--line); color: var(--muted); }
  .row .opp { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .when { color: var(--muted); font-size: 12px; text-align: right; flex: none; }
  .news .src { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .news .t { font-weight: 600; }
  .team-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 6px; }
  .team-head img, .team-head .dot { width: 44px; height: 44px; object-fit: contain; }
  .team-head .dot { border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; font-weight: 900; color: #fff; }
  .team-head h3 { font-size: 22px; }
  .team-head p { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
  .btn { display: inline-block; margin: 4px 6px 4px 0; padding: 8px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); color: var(--text); text-decoration: none; font-size: 14px; }
  details > summary { cursor: pointer; list-style: none; padding: 2px 0 6px; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: " ▾"; color: var(--muted); }
  details[open] > summary::after { content: " ▴"; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
  .tile { background: linear-gradient(160deg, color-mix(in srgb, var(--c2) 40%, var(--card)), var(--card) 75%);
          border: 1px solid var(--line); border-radius: 20px; padding: 18px 12px 14px;
          display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .go { width: 100%; padding: 10px 0; border: 0; border-radius: 12px; font: 800 16px/1 inherit; letter-spacing: 2px;
        color: #fff; background: linear-gradient(135deg, var(--c1), var(--c2)); cursor: pointer; box-shadow: 0 4px 14px #0006; }
  .go:active { transform: scale(.96); }
  .crest { position: relative; display: inline-block; flex: none; }
  .crest img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .crest.noimg { border-radius: 50%; background: linear-gradient(135deg, var(--c1), var(--c2)); display: inline-grid; place-items: center; }
  .crest.noimg::after { content: attr(data-abbr); color: #fff; font-weight: 900; }
  .crest.big { width: 110px; height: 110px; font-size: 44px; }
  .crest.mid { width: 52px; height: 52px; font-size: 22px; }
  .crest.ic { width: 28px; height: 28px; font-size: 13px; }
  #back { background: none; border: 0; color: var(--text); font-size: 30px; line-height: 1; padding: 0 6px 4px 0; cursor: pointer; }
  .chip { display: inline-block; font: 600 12px/1 inherit; padding: 6px 10px; border-radius: 999px; margin: 2px 4px 2px 0;
          border: 1px solid var(--accent); color: var(--text); background: color-mix(in srgb, var(--accent) 18%, transparent); cursor: pointer; }
  .match-card { cursor: pointer; }
  .row.click { cursor: pointer; }
  .ev { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .ev:last-child { border-bottom: 0; }
  .ev.away { text-align: right; }
  .ev .min { color: var(--muted); font-variant-numeric: tabular-nums; }
  .stat { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; gap: 4px 8px; padding: 6px 0; font-size: 13px; }
  .stat span:last-of-type { text-align: right; }
  .stat .lbl { text-align: center; color: var(--muted); }
  .stat .bar { grid-column: 1 / -1; display: flex; gap: 3px; height: 5px; }
  .stat .bar i { display: block; background: var(--accent); border-radius: 3px; }
  .stat .bar i.b { background: var(--muted); }
  .seg { display: flex; gap: 6px; margin: 2px 0 4px; overflow-x: auto; }
  .seg button { flex: none; background: var(--card); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .seg button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
</style>
</head>
<body>
<header>
  <button id="back" aria-label="Indietro" hidden>‹</button>
  <button id="home" hidden>⌂ Home</button>
  <span class="spacer"></span>
  <span id="upd"></span>
  <button id="bell" aria-label="Notifiche">🔕</button>
  <button id="refresh" aria-label="Aggiorna">↻</button>
</header>
<div class="layout">
  <main id="view"></main>
  <aside id="side"><h2 class="side-title">Prossime partite</h2><div id="upcoming"></div></aside>
</div>
<div id="toast" hidden></div>
<script src="app.js?v=16"></script>
</body>
</html>
